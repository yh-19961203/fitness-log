</style></head><body><header class="top"><div class="wrap"><h1>🏋️ 我的健康记录</h1><p>训练 · 饮食 · 能量收支 · 体重</p></div></header><main><div class="nav"><button class="selected" data-tab="record">训练</button><button data-tab="history">历史</button><button data-tab="diet">饮食</button><button data-tab="balance">收支</button><button data-tab="library">动作</button><button data-tab="backup">备份</button></div><div id="app"></div></main><div id="toast" role="status"></div><div id="chooser" aria-hidden="true"><div class="choose-sheet" role="dialog" aria-modal="true" aria-label="选择项目"><div class="choose-top"><strong id="chooseTitle">选择</strong><button id="chooseClose" aria-label="关闭">×</button></div><input class="choose-input" id="chooseSearch" placeholder="搜索名称…" autocomplete="off"><div class="choose-list" id="chooseList"></div></div></div><script>
'use strict';const KEY='fitness_diary_v1';const DIETKEY='fitness_diet_v4';const BALKEY='fitness_energy_balance_v5';const defaults=[["杠铃平板卧推","kg","胸"],["哑铃平板卧推","kg","胸"],["上斜哑铃卧推","kg","胸"],["上斜杠铃卧推","kg","胸"],["坐姿器械推胸","kg","胸"],["蝴蝶机夹胸","kg","胸"],["龙门架夹胸","kg","胸"],["双杠臂屈伸","kg","胸"],["高位下拉","kg","背"],["对卧高位下拉","kg","背"],["直杆高位下拉","kg","背"],["高把位下拉","kg","背"],["窄握高位下拉","kg","背"],["引体向上（辅助器械）","kg","背"],["坐姿器械划船","kg","背"],["坐姿龙门架划船（肩胛后缩主导）","kg","背"],["反手龙门架划船（肩胛骨稳定）","kg","背"],["单臂哑铃划船","kg","背"],["杠铃俯身划船","kg","背"],["胸托划船","kg","背"],["直臂下压","kg","背"],["反向夹肩胛骨","kg","背"],["反向飞鸟（肩胛后缩主导）","kg","背"],["坐姿哑铃推肩","kg","肩"],["杠铃推举","kg","肩"],["史密斯推肩","kg","肩"],["坐姿器械推肩","kg","肩"],["哑铃侧平举","kg","肩"],["绳索侧平举","kg","肩"],["哑铃前平举","kg","肩"],["反向蝴蝶机飞鸟","kg","肩"],["俯身哑铃反向飞鸟","kg","肩"],["面拉","kg","肩"],["杠铃深蹲","kg","腿"],["史密斯深蹲","kg","腿"],["哈克深蹲","kg","腿"],["腿举机","kg","腿"],["哑铃高脚杯深蹲","kg","腿"],["罗马尼亚硬拉","kg","腿"],["哑铃罗马尼亚硬拉","kg","腿"],["腿屈伸","kg","腿"],["坐姿腿弯举","kg","腿"],["俯卧腿弯举","kg","腿"],["保加利亚分腿蹲","kg","腿"],["哑铃箭步蹲","kg","腿"],["臀推","kg","腿"],["坐姿髋外展","kg","腿"],["站姿提踵","kg","腿"],["坐姿提踵","kg","腿"],["哑铃单臂弯举","kg","二头"],["哑铃双臂弯举","kg","二头"],["哑铃垂式弯举","kg","二头"],["龙门架绳索垂式弯举","kg","二头"],["龙门架直杆弯举","kg","二头"],["单手龙门架弯举","kg","二头"],["牧师椅弯举","kg","二头"],["绳索下压","kg","三头"],["直杆下压","kg","三头"],["哑铃颈后臂屈伸","kg","三头"],["仰卧臂屈伸","kg","三头"],["绳索卷腹","kg","核心"],["卷腹","kg","核心"],["平板支撑","kg","核心"],["悬垂举腿","kg","核心"]];
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const seeded=()=>({exercises:defaults.map(([name,unit,group])=>({id:uid(),name,unit,group})),sessions:[],draft:null});let data;try{data=JSON.parse(localStorage.getItem(KEY))||seeded();if(!Array.isArray(data.exercises)||!Array.isArray(data.sessions))throw Error()}catch{data=seeded()}// 升级动作库：保留用户自定义动作与训练历史。旧“片”数据移至备注，不擅自转换成kg。
function upgradeData(){
 for(const [name,unit,group] of defaults){if(!data.exercises.some(e=>e.name===name))data.exercises.push({id:uid(),name,unit:'kg',group});}
 const oldUnits=new Map(data.exercises.map(e=>[e.id,e.unit]));
 const groups=new Map(defaults.map(([name,unit,group])=>[name,group]));
 for(const e of data.exercises){if(groups.has(e.name))e.group=groups.get(e.name);e.unit='kg';}
 function migrateItems(items){for(const i of items||[]){const u=oldUnits.get(i.exerciseId);if(u&&u!=='kg'){for(const st of i.sets||[]){if(st.weight!==''&&st.weight!==null&&st.weight!==undefined){st.extra=('旧记录：'+st.weight+u+(st.extra?'；'+st.extra:''));st.weight='';}}}}}

 if(data.draft)migrateItems(data.draft.items);
 data.version=2;
}
if(data.version!==2){upgradeData();try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}}

 app.innerHTML=`<section class="card"><h2>🍽️ 每日饮食记录</h2><div class="line"><div class="field"><label>记录日期</label><input id="dietDate" type="date" value="${esc(day)}"></div></div><div class="stats"><div><small>已记录摄入</small><strong>${Math.round(sum)} kcal</strong></div><div><small>已记录蛋白质</small><strong>${nf(prot)} g</strong></div><div><small>训练消耗（自行填写）</small><strong>${burn?Math.round(burn)+' kcal':'未填写'}</strong></div></div><p class="hint">仅统计已录入的食物。食堂菜、卤味等热量可能有较大误差；不建议把训练消耗直接从摄入中全额扣减。</p></section>

// 热量缺口与体重：BMR按Mifflin-St Jeor估算；活动系数只计不含专门训练的日常活动，避免重复计数。
let balance;try{balance=JSON.parse(localStorage.getItem(BALKEY))||{}}catch{balance={}}
if(!balance.profile)balance.profile={sex:'male',age:30,height:172,weight:81,activity:'1.2'};
if(!balance.days||typeof balance.days!=='object')balance.days={};
let balanceDate=today();
const saveBalance=()=>{try{localStorage.setItem(BALKEY,JSON.stringify(balance))}catch{toast('热量数据保存失败，请导出备份')}};
function renderBalance(){
 const p=balance.profile, day=balanceDate, rec=balance.days[day]||{}, currentWeight=Number(rec.weight)>0?Number(rec.weight):Number(p.weight)||81;
 const bmr=10*currentWeight+6.25*(Number(p.height)||172)-5*(Number(p.age)||30)+(p.sex==='female'?-161:5);
 const baseline=Math.max(0,Math.round(bmr*Number(p.activity||1.2)));
 const meals=diet.entries.filter(e=>e.date===day), intake=meals.reduce((sum,e)=>sum+(Number(e.cal)||0),0);
 const sessions=data.sessions.filter(e=>e.date===day), withBurn=sessions.filter(e=>e.calories!==''&&e.calories!==null&&e.calories!==undefined&&Number.isFinite(Number(e.calories)));
 const train=withBurn.reduce((sum,e)=>sum+Number(e.calories),0), exerciseMissing=sessions.length>withBurn.length;
 // 不把“完全没记录摄入”误认为零热量；没有填写训练消耗的训练日明确提示缺失。
 const estimatedOut=baseline+train, deficit=estimatedOut-intake;
 const hasMeals=meals.length>0, target=Number(rec.target)||0;
 const weights=Object.entries(balance.days).filter(([k,v])=>v&&Number(v.weight)>0).sort((a,b)=>a[0].localeCompare(b[0])).slice(-12);
 app.innerHTML=`<section class="card"><h2>⚖️ 每日热量缺口与体重</h2><div class="line"><div class="field"><label>日期</label><input type="date" id="balDate" value="${esc(day)}"></div><div class="field"><label>当天体重（kg）</label><input type="number" id="balWeight" min="25" max="350" step="0.1" inputmode="decimal" placeholder="如 81.0" value="${esc(rec.weight??'')}"></div></div><p class="hint">体重建议早晨起床后、如厕后、早餐前测量。留空时使用个人设置中的参考体重。</p></section>
 <section class="card"><h2>📊 当天能量收支</h2><div class="stats"><div><small>日常消耗估算</small><strong>${baseline} kcal</strong></div><div><small>训练消耗（手填）</small><strong>${Math.round(train)} kcal</strong></div><div><small>饮食已记录摄入</small><strong>${Math.round(intake)} kcal</strong></div></div><div class="stats"><div><small>估计总消耗</small><strong>${estimatedOut} kcal</strong></div><div><small>${hasMeals?'暂估热量缺口':'热量缺口'}</small><strong>${hasMeals?(deficit>=0?'缺口 ':'盈余 ')+Math.abs(Math.round(deficit))+' kcal':'尚不能计算'}</strong></div><div><small>基础代谢 BMR</small><strong>${Math.round(bmr)} kcal</strong></div></div>
 <div class="notice">${!hasMeals?'当天还没有饮食记录，不能将摄入视为0。':''}${hasMeals?'只根据已记录食物计算摄入；如果少记一餐，缺口会被高估。':''}${exerciseMissing?' 有训练未填写消耗热量，总消耗可能被低估。':''} 日常消耗是估算，不包括专门训练；训练消耗来自手动输入。手表若显示全天总消耗，请勿作为训练消耗重复加上。</div>
 <div class="line"><button id="goDiet">去填写饮食</button><button id="goTrain">去填写训练</button></div></section>
 <section class="card"><h2>🧮 日常消耗设置</h2><p class="hint">采用 Mifflin-St Jeor 公式估算基础代谢，再乘不含单独锻炼的日常活动系数。默认参数是示例，请按照自身情况调整。</p><div class="line"><div class="field"><label>计算用性别</label><select id="balSex"><option value="male" ${p.sex==='male'?'selected':''}>男</option><option value="female" ${p.sex==='female'?'selected':''}>女</option></select></div><div class="field"><label>年龄（岁）</label><input type="number" id="balAge" min="15" max="100" value="${esc(p.age)}"></div><div class="field"><label>身高（cm）</label><input type="number" id="balHeight" min="100" max="230" step="0.1" value="${esc(p.height)}"></div><div class="field"><label>参考体重（kg）</label><input type="number" id="balReference" min="25" max="350" step="0.1" value="${esc(p.weight)}"></div></div><div class="field" style="margin-top:10px"><label>非训练时间的日常活动</label><select id="balActivity"><option value="1.2" ${p.activity==='1.2'?'selected':''}>久坐为主（×1.20）</option><option value="1.35" ${p.activity==='1.35'?'selected':''}>经常走动、轻活动（×1.35）</option><option value="1.5" ${p.activity==='1.5'?'selected':''}>工作中经常站立、行走（×1.50）</option><option value="1.65" ${p.activity==='1.65'?'selected':''}>体力工作较多（×1.65）</option></select></div><p class="hint">例如坐办公室可先选1.20；矿山需要频繁步行的日子可考虑1.35–1.50。系数本身有误差，最终应结合2–4周体重趋势校正。</p></section>
 <section class="card"><h2>📉 近期体重记录</h2>${weights.length?`<div class="hist"><div class="line"><b class="grow">${esc(weights[0][0])}：${weights[0][1].weight} kg</b><span class="pill">最新 ${weights[weights.length-1][1].weight} kg</span></div></div>${weights.slice().reverse().map(([date,v])=>`<div class="line hist"><span class="grow">${esc(date)}</span><b>${Number(v.weight).toFixed(1)} kg</b><button data-removeweight="${esc(date)}">删除</button></div>`).join('')}`:'<p class="empty">暂无体重记录，先输入今天的体重吧。</p>'}<p class="hint">单日变化主要受水分等影响，更建议观察每周平均体重。</p></section>`;
 document.getElementById('balDate').onchange=e=>{balanceDate=e.target.value||today();renderBalance()};
 document.getElementById('balWeight').onchange=e=>{const val=e.target.value;if(val!==''&&(!(Number(val)>=25)||Number(val)>350)){toast('请填写合理的体重');return}balance.days[day]??={};if(val==='')delete balance.days[day].weight;else balance.days[day].weight=Number(val);saveBalance();renderBalance()};
 for(const [id,key] of [['balSex','sex'],['balAge','age'],['balHeight','height'],['balReference','weight'],['balActivity','activity']]){document.getElementById(id).onchange=e=>{if(key==='sex'||key==='activity')p[key]=e.target.value;else{let n=Number(e.target.value);const bounds={age:[15,100],height:[100,230],weight:[25,350]}[key];if(!Number.isFinite(n)||n<bounds[0]||n>bounds[1]){toast('参数超出合理范围');return}p[key]=n}saveBalance();renderBalance()}}
 document.getElementById('goDiet').onclick=()=>{diet.selectedDate=day;saveDiet();setTab('diet')};document.getElementById('goTrain').onclick=()=>setTab('record');
 document.querySelectorAll('[data-removeweight]').forEach(b=>b.onclick=()=>{const date=b.dataset.removeweight;if(confirm('删除 '+date+' 的体重记录？')){delete balance.days[date].weight;saveBalance();renderBalance()}});
}


// Small, searchable chooser, rendered inside the page to avoid Android system select full-screen UI.
function enhancePickers(){
 for(const id of ['pick','dietFood']){
  const s=document.getElementById(id);if(!s||s.dataset.enhanced)return;
  s.dataset.enhanced='1';s.classList.add('native-picker');
  const btn=document.createElement('button');btn.type='button';btn.className='picker-btn';
  const refresh=()=>{let o=s.selectedOptions[0];btn.innerHTML='<span>'+esc(o&&o.value?o.textContent:(id==='pick'?'搜索并选择训练动作':'选择常用食品'))+'</span>'};
  refresh();s.insertAdjacentElement('afterend',btn);
  btn.addEventListener('click',()=>openChooser(id,refresh));
  s.addEventListener('change',refresh);
 }
}
function openChooser(id,refresh){
 const sel=document.getElementById(id), overlay=document.getElementById('chooser'),input=document.getElementById('chooseSearch'),list=document.getElementById('chooseList');
 if(!sel)return;document.getElementById('chooseTitle').textContent=id==='pick'?'选择训练动作':'选择常用食品';input.value='';overlay.classList.add('show');overlay.setAttribute('aria-hidden','false');
 const build=()=>{let q=input.value.trim().toLowerCase();let opts=[...sel.options].filter(o=>o.value&&!o.hidden&&o.textContent.toLowerCase().includes(q));list.replaceChildren();
 if(!opts.length){let x=document.createElement('p');x.className='empty';x.textContent='没有找到符合的项目';list.append(x);return}
 for(const o of opts){let b=document.createElement('button');b.type='button';b.className='choose-row';b.textContent=o.textContent;b.onclick=()=>{sel.value=o.value;sel.dispatchEvent(new Event('change',{bubbles:true}));refresh();closeChooser()};list.append(b)}
 };input.oninput=build;build();
}
function closeChooser(){let o=document.getElementById('chooser');o.classList.remove('show');o.setAttribute('aria-hidden','true')}
document.getElementById('chooseClose').onclick=closeChooser;
document.getElementById('chooser').addEventListener('click',e=>{if(e.target.id==='chooser')closeChooser()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeChooser()});

render();</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));}</script></body></html>
